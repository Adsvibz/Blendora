name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Check Project
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo ""
          echo "=== APP ==="
          ls -la app

          echo ""
          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle.kts" -o -name "build.gradle.kts" \) \
            -print

      - name: Build Debug APK
        run: |
          set +e

          echo "=== BUILDING BLENDORA ==="

          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "BUILD EXIT CODE: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========== ERRORS =========="

            grep -iE \
              "error|exception|failed|failure|caused by|could not|unable to|resource linking|manifest merger|compilation" \
              build.log | tail -200 || true

            echo ""
            echo "========== LAST 200 LINES =========="

            tail -200 build.log

            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "BUILD SUCCESSFUL"

      - name: Verify APK
        run: |
          echo "=== APK FILES ==="

          find app/build/outputs -type f -name "*.apk" -print

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blendora-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
