name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo ""
          echo "=== TOP LEVEL ==="
          ls -la

          echo ""
          echo "=== FIND ANDROID PROJECT ==="
          find . -maxdepth 4 -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print

          echo ""
          echo "=== FIND APP MODULE ==="
          find . -maxdepth 5 -type d -name "app" -print

      - name: Detect Project Directory
        id: project
        shell: bash
        run: |
          set -e

          APP_DIR=$(find . -maxdepth 5 -type d -name "app" | head -1)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not find Android app module."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_DIR")

          echo "APP_DIR=$APP_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR"

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set +e

          echo "=== BUILD DIRECTORY ==="
          pwd

          echo ""
          echo "=== PROJECT FILES ==="
          ls -la

          echo ""
          echo "=== APP MODULE ==="
          ls -la app

          echo ""
          echo "=== BUILDING APK ==="

          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========== BUILD ERRORS =========="

            grep -iE \
              "error|exception|failed|failure|caused by|could not|unable to|resource linking|manifest merger|compilation" \
              build.log | tail -200 || true

            echo ""
            echo "========== LAST 200 LINES =========="

            tail -200 build.log

            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "BUILD SUCCESSFUL"

      - name: Find APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "=== GENERATED APK FILES ==="

          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blendora-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
